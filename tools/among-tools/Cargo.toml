[package]
name = "among-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.44"
nix = { version = "=0.30.1", features = ["signal", "process", "fs", "user"] }
roxmltree = "=0.20.0"
toml = "=1.1.6"
serde_yaml_ng = "=0.10.0"
syn = { version = "=3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[[bin]]
name = "among-uninstall"
path = "src/uninstall.rs"

[[bin]]
name = "among-apprun"
path = "src/apprun.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
