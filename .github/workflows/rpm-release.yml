name: RPM release candidates

# Release-tag-only. A candidate is built and inspected here; nothing is
# published. Attaching artifacts to a release requires the separate protected
# promotion gate, because building a package and shipping it are different acts.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rpm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora43
            architecture: amd64
            runner: ubuntu-24.04
            fedora: 43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - target: fedora43
            architecture: arm64
            runner: ubuntu-24.04-arm
            fedora: 43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - target: fedora44
            architecture: amd64
            runner: ubuntu-24.04
            fedora: 44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - target: fedora44
            architecture: arm64
            runner: ubuntu-24.04-arm
            fedora: 44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      AMONG_CHECK_ROOT: /var/lib/among-checks
      CARGO_HOME: /var/lib/among-checks/cargo
      CARGO_TARGET_DIR: /var/lib/among-checks/target
      RUSTUP_HOME: /opt/among-rustup
      RUSTUP_TOOLCHAIN: 1.98.1
      BUILD_IMAGE: ${{ matrix.image }}
    steps:
      - name: Install Git before checkout so release identity uses a real repository
        run: dnf install -y --nodocs git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tooling without an installed Rust toolchain
        run: |
          set -eu
          mkdir -p "$AMONG_CHECK_ROOT"
          dnf install -y --nodocs \
            cargo rust \
            gcc \
            pkgconf-pkg-config \
            gtk4-devel \
            libadwaita-devel \
            vte291-gtk4-devel \
            desktop-file-utils \
            libappstream-glib \
            librsvg2-tools \
            gzip \
            rpm-build \
            rpmdevtools \
            git \
             tar \
              zstd curl ca-certificates cpio shadow-utils util-linux util-linux-script
          rpm --version

      - name: Install pinned Rust and validate tag-bound packaging inputs
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) host=x86_64-unknown-linux-gnu ;;
            aarch64) host=aarch64-unknown-linux-gnu ;;
            *) exit 1 ;;
          esac
          base="https://static.rust-lang.org/rustup/archive/1.28.2/$host"
          curl -fsSL "$base/rustup-init" -o /tmp/rustup-init
          curl -fsSL "$base/rustup-init.sha256" -o /tmp/rustup-init.sha256
          (cd /tmp && sha256sum --check rustup-init.sha256)
          chmod 755 /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.98.1
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test rpm --test rpm_workflow --test live
          "$AMONG_CHECK_ROOT"/target/debug/among-tools check-rpm-spec .
          "$AMONG_CHECK_ROOT"/target/debug/among-tools prepare-rpm-release . "$AMONG_CHECK_ROOT"/among.spec > "$AMONG_CHECK_ROOT"/rpm-version.txt
          epoch=$(git -c "safe.directory=$(pwd -P)" show -s --format=%ct HEAD)
          case "$epoch" in ''|*[!0-9]*) echo 'invalid source commit timestamp' >&2; exit 1 ;; esac
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Build the source tarball the spec expects
        run: |
          set -eu
          version=$(cat "$AMONG_CHECK_ROOT"/rpm-version.txt)
          # rpmbuild resolves Source0 only in %{_sourcedir}, and writing the
          # archive inside the tree being archived makes tar report "file
          # changed as we read it" and exit non-zero. Write it straight into
          # SOURCES, outside the checkout.
          sources="$AMONG_CHECK_ROOT"/rpmbuild/SOURCES
          mkdir -p "$sources"
          staging="among-${version}"
          tar --exclude-vcs \
              --exclude='./target' \
              --exclude='./tools/among-tools/target' \
              --exclude='./examples/plugins/target' \
              --exclude='./.opencode' \
              --exclude='./.github' \
              --transform "s,^\./,$staging/," \
              -czf "$sources/${staging}.tar.gz" \
              .
          tar -tzf "$sources/${staging}.tar.gz" > "$AMONG_CHECK_ROOT"/srpm-contents.txt
          if grep -qE '(^|/)\.opencode/|(^|/)\.git/|/target/' "$AMONG_CHECK_ROOT"/srpm-contents.txt; then
            echo 'source tarball contains private or build state' >&2
            exit 1
          fi
          # %autosetup -n %{name}-%{version} needs exactly this top level.
          tar -tzf "$sources/${staging}.tar.gz" \
            | grep -qE "^${staging}/Cargo\.toml$" \
            || { echo "tarball lacks ${staging}/Cargo.toml for autosetup" >&2; exit 1; }
          # The SRPM is the source delivered with the RPM: it must hold exactly
          # the tagged commit's files, not whatever else the checkout contains.
          "$AMONG_CHECK_ROOT"/target/debug/among-tools check-rpm-source-archive . \
            "$AMONG_CHECK_ROOT"/srpm-contents.txt "$staging"
          ls -l "$sources/${staging}.tar.gz"

      - name: Build the binary RPM and the SRPM
        run: |
          set -eu
          useradd --create-home --shell /bin/bash among-builder
          chown among-builder:among-builder "$AMONG_CHECK_ROOT"
          chown -R among-builder:among-builder "$AMONG_CHECK_ROOT"/rpmbuild "$AMONG_CHECK_ROOT"/cargo
          /usr/sbin/runuser --user among-builder -- /usr/bin/env \
            "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" \
            "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            /usr/bin/rpmbuild --define "_topdir $AMONG_CHECK_ROOT/rpmbuild" \
                   --define "_build_id_links none" \
                   --define "debug_package %{nil}" \
                    -ba "$AMONG_CHECK_ROOT"/among.spec \
                   > "$AMONG_CHECK_ROOT"/rpmbuild.log 2>&1 || {
            echo 'rpmbuild failed; evidence:' >&2
            tail -40 "$AMONG_CHECK_ROOT"/rpmbuild.log >&2
            exit 1
          }
          find "$AMONG_CHECK_ROOT"/rpmbuild/RPMS -name '*.rpm' -print
          find "$AMONG_CHECK_ROOT"/rpmbuild/SRPMS -name '*.rpm' -print

      - name: Exactly one binary RPM and one SRPM
        run: |
          set -eu
          binaries=$(find "$AMONG_CHECK_ROOT"/rpmbuild/RPMS -name '*.rpm' ! -name '*.src.rpm')
          set -- $binaries
          test "$#" -eq 1 || { echo "expected one binary RPM, found $#" >&2; exit 1; }
          binary="$1"
          sources=$(find "$AMONG_CHECK_ROOT"/rpmbuild/SRPMS -name '*.src.rpm')
          set -- $sources
          test "$#" -eq 1 || { echo "expected one SRPM, found $#" >&2; exit 1; }
          printf '%s\n' "$binary" > "$AMONG_CHECK_ROOT"/binary-rpm-path.txt
          printf '%s\n' "$1" > "$AMONG_CHECK_ROOT"/srpm-path.txt
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$binary"
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$1"

      - name: The package architecture and ELF machine must match the runner
        run: |
          set -eu
          binary=$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)
          observed=$(rpm -qp --qf '%{ARCH}' "$binary")
          case "${{ matrix.architecture }}" in
            amd64) want=x86_64 ;;
            arm64) want=aarch64 ;;
          esac
          if [ "$observed" != "$want" ]; then
            echo "package arch $observed does not match ${{ matrix.architecture }} ($want)" >&2
            exit 1
          fi
          # The RPM tag alone is a claim; the shipped executable's ELF header is
          # the evidence. A mislabelled architecture would install binaries the
          # loader cannot run.
          workdir=$(mktemp -d)
          rpm2cpio "$binary" | (cd "$workdir" && cpio -idm --quiet)
          for binary_path in "$workdir"/usr/bin/among "$workdir"/usr/share/among/plugins/clock \
              "$workdir"/usr/share/among/plugins/system-status "$workdir"/usr/share/among/plugins/pane-pwd; do
            test -f "$binary_path" || { echo "missing packaged executable $binary_path" >&2; exit 1; }
            machine=$(od -An -tx1 -j18 -N2 "$binary_path" | tr -d ' \n')
            case "${{ matrix.architecture }}:$machine" in
              amd64:3e00|x86_64:3e00) ;;
              arm64:b700|aarch64:b700) ;;
              *) echo "ELF e_machine $machine does not match ${{ matrix.architecture }}" >&2; exit 1 ;;
            esac
          done
          rm -rf "$workdir"

      - name: Inspect the payload for development dependencies and stray files
        run: |
          set -eu
          rpm -qpl "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" | sort > "$AMONG_CHECK_ROOT"/rpm-files.txt
          cat "$AMONG_CHECK_ROOT"/rpm-files.txt
          # A build tool or a development package must never be shipped or
          # required at run time.
          if grep -qE '/(cargo|rustc|rustup)$|rust(-std)?-devel|\.rlib$' "$AMONG_CHECK_ROOT"/rpm-files.txt; then
            echo 'development artifacts leaked into the payload' >&2
            exit 1
          fi
          if rpm -qp --requires "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" \
             | grep -qE '^(cargo|rust)(-|:|$)'; then
            echo 'the package requires a Rust toolchain at run time' >&2
            exit 1
          fi
          # The internal checkers are build tooling and must not ship.
          if grep -qE 'among-tools|among-uninstall' "$AMONG_CHECK_ROOT"/rpm-files.txt; then
            echo 'internal tooling leaked into the payload' >&2
            exit 1
          fi
          # A bundled shared object would shadow the system library and break
          # the LGPL replacement and debugging obligations this project
          # documents. Nothing may own a library path.
          if grep -qE '\.so($|\.)|^/usr/lib|^/lib' "$AMONG_CHECK_ROOT"/rpm-files.txt; then
            echo 'the payload bundles native libraries' >&2
            grep -E '\.so($|\.)|^/usr/lib|^/lib' "$AMONG_CHECK_ROOT"/rpm-files.txt >&2
            exit 1
          fi
          # Allowlist: every owned path must be one the spec names. This is
          # what catches an accidental stray file a name blocklist misses.
          grep -vE '^(/etc/|/usr/share/doc/|/usr/share/licenses/among($|/)|/usr/bin/among$|/usr/share/among($|/plugins($|/[^/]+$))|/usr/share/applications/[^/]+$|/usr/share/icons/hicolor/scalable/apps/[^/]+$|/usr/share/metainfo/[^/]+$)' \
            "$AMONG_CHECK_ROOT"/rpm-files.txt > "$AMONG_CHECK_ROOT"/rpm-unexpected.txt || true
          if test -s "$AMONG_CHECK_ROOT"/rpm-unexpected.txt; then
            echo 'the payload owns files the spec does not declare' >&2
            cat "$AMONG_CHECK_ROOT"/rpm-unexpected.txt >&2
            exit 1
          fi

      - name: License notices in the payload match the tagged source and the locked inventory
        run: |
          set -eu
          binary=$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)
          payload="$AMONG_CHECK_ROOT"/payload
          mkdir "$payload"
          rpm2cpio "$binary" | (cd "$payload" && cpio -idm --quiet)
          rpm -qp --requires "$binary" > "$AMONG_CHECK_ROOT"/rpm-all-requires.txt
          # The packaged notice texts themselves against the three locked Cargo
          # graphs, then byte equality with the tag and the system/shipped split.
          "$AMONG_CHECK_ROOT"/target/debug/among-tools third-party-notices . \
            "$payload/usr/share/licenses/among/THIRD_PARTY" check
          "$AMONG_CHECK_ROOT"/target/debug/among-tools check-rpm-notices . "$payload" \
            "$AMONG_CHECK_ROOT"/rpm-all-requires.txt > "$AMONG_CHECK_ROOT"/rpm-notices.json
          cat "$AMONG_CHECK_ROOT"/rpm-notices.json

      - name: Resolve every runtime dependency in a clean environment
        run: |
          set -eu
          # The generated soname requires must be satisfiable from the
          # configured repositories. This resolves what the package declares;
          # a clean install is a separate, later gate.
          rpm -qp --requires "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" \
            | grep -E '\.so' | sort -u > "$AMONG_CHECK_ROOT"/rpm-requires.txt
          cat "$AMONG_CHECK_ROOT"/rpm-requires.txt
          if ! test -s "$AMONG_CHECK_ROOT"/rpm-requires.txt; then
            echo 'the package declares no shared library requirement at all' >&2
            exit 1
          fi
          for soname in $(cat "$AMONG_CHECK_ROOT"/rpm-requires.txt); do
            # The providing package must exist in the archive metadata; a
            # dependency no repository carries would break installation.
            dnf -q repoquery --whatprovides "$soname" > "$AMONG_CHECK_ROOT"/provider.txt
            test -s "$AMONG_CHECK_ROOT"/provider.txt \
              || { echo "no package provides $soname" >&2; exit 1; }
          done

      - name: Record exact digests and the build environment
        run: |
          set -eu
          {
            echo "target=${{ matrix.target }}"
            echo "architecture=${{ matrix.architecture }}"
            echo "runner=${{ matrix.runner }}"
            echo "image=${{ matrix.image }}"
            echo "fedora=$(rpm -E %fedora)"
            echo "rust=$(cargo --version)"
            echo "rpm=$(rpm --version | head -1)"
            echo "tag=${GITHUB_REF_NAME}"
            # The library versions this target's executables were linked
            # against; rpmbuild already refused any below the spec floors.
            for module in gtk4 libadwaita-1 vte-2.91-gtk4; do
              echo "linked-$module=$(pkg-config --modversion "$module")"
            done
          } > "$AMONG_CHECK_ROOT"/build-environment.txt
          cat "$AMONG_CHECK_ROOT"/build-environment.txt
          sha256sum "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" \
                    "$(cat "$AMONG_CHECK_ROOT"/srpm-path.txt)" \
                    > "$AMONG_CHECK_ROOT"/rpm-digests.txt
          cat "$AMONG_CHECK_ROOT"/rpm-digests.txt
          cargo build --release --locked --manifest-path tools/among-tools/Cargo.toml
          mkdir -p "$AMONG_CHECK_ROOT"/rpm-candidate
          cp "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" "$AMONG_CHECK_ROOT"/rpm-candidate/
          cp "$AMONG_CHECK_ROOT"/target/release/among-tools "$AMONG_CHECK_ROOT"/rpm-candidate/
          # The older package for the installed lifecycle check is the
          # candidate's payload repacked under a lower version. rpmbuild may not
          # exist on the clean installed worker, so it is made here, unprivileged,
          # in a directory of its own that marks it as never a release asset.
          mkdir "$AMONG_CHECK_ROOT"/fixture-work
          chown among-builder:among-builder "$AMONG_CHECK_ROOT"/fixture-work "$AMONG_CHECK_ROOT"/rpm-candidate
          /usr/sbin/runuser --user among-builder -- "$AMONG_CHECK_ROOT"/target/release/among-tools \
            make-rpm-older-fixture "$(cat "$AMONG_CHECK_ROOT"/binary-rpm-path.txt)" \
            "$AMONG_CHECK_ROOT"/fixture-work "$AMONG_CHECK_ROOT"/rpm-candidate
          "$AMONG_CHECK_ROOT"/target/release/among-tools record-rpm-candidate . "${{ matrix.target }}" "${{ matrix.architecture }}" "$AMONG_CHECK_ROOT"/rpm-candidate
          (cd "$AMONG_CHECK_ROOT"/rpm-candidate && sha256sum among-tools *.rpm ci-lifecycle-fixture-not-for-release/*.rpm > SHA256SUMS)

      - name: Retain the candidate and its evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-checked-${{ matrix.target }}-${{ matrix.architecture }}
          path: |
            ${{ env.AMONG_CHECK_ROOT }}/rpmbuild/RPMS
            ${{ env.AMONG_CHECK_ROOT }}/rpmbuild/SRPMS
            ${{ env.AMONG_CHECK_ROOT }}/rpm-files.txt
            ${{ env.AMONG_CHECK_ROOT }}/rpm-digests.txt
            ${{ env.AMONG_CHECK_ROOT }}/build-environment.txt
            ${{ env.AMONG_CHECK_ROOT }}/srpm-contents.txt
          retention-days: 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.target }}-${{ matrix.architecture }}
          path: ${{ env.AMONG_CHECK_ROOT }}/rpm-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Publication boundary
        if: ${{ always() }}
        run: |
          echo 'RPM candidates are built and inspected only; publication requires the separate protected promotion gate' \
            >> "$GITHUB_STEP_SUMMARY"

  installed:
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora43
            architecture: amd64
            runner: ubuntu-24.04
            fedora: 43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - target: fedora43
            architecture: arm64
            runner: ubuntu-24.04-arm
            fedora: 43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - target: fedora44
            architecture: amd64
            runner: ubuntu-24.04
            fedora: 44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - target: fedora44
            architecture: arm64
            runner: ubuntu-24.04-arm
            fedora: 44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      AMONG_CHECK_ROOT: /var/lib/among-checks
    steps:
      - name: Install display tools without a compiler or development headers
        run: |
          dnf install -y git ca-certificates glib2 desktop-file-utils appstream libappstream-glib \
            xorg-x11-server-Xvfb xorg-x11-xauth xprop xdpyinfo xwininfo openbox dbus-x11 \
            xdotool procps-ng ImageMagick util-linux shadow-utils
          mkdir -p "$AMONG_CHECK_ROOT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rpm-${{ matrix.target }}-${{ matrix.architecture }}
          path: release-candidate
      - name: Install and exercise exact native RPM as an unprivileged user
        run: |
          (cd release-candidate && sha256sum --check SHA256SUMS)
          chmod 755 release-candidate/among-tools
          release-candidate/among-tools ci-rpm-install . "${{ matrix.target }}" \
            "${{ matrix.architecture }}" release-candidate runtime-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rpm-runtime-${{ matrix.target }}-${{ matrix.architecture }}
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
