name: Published plugin inputs

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact name, unique within the calling run.
        type: string
        required: true

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The consumers check out the pull request head, not the merge commit.
          # The producer must read the same pin file or a pin that changed after
          # the branch was cut makes the receipt disagree with its consumers.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare the observation tool
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          bash scripts/ci/apt-install.sh -y libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev pkg-config
          cargo +1.98.1 build --release --locked --manifest-path tools/among-tools/Cargo.toml
      - name: Observe and download the pinned immutable publication
        env:
          # Anonymous API calls share the runner address with every other job
          # and are refused when its hourly allowance is spent. This is the
          # first step that hands a token to a binary built from the pull
          # request's sources; the token reads only public repository data,
          # lives until the job ends, and is read-only for fork pull requests
          # too. The worst a compromised build can do is spend the request
          # allowance. No permission is widened.
          AMONG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/among-tools/target/release/among-tools fetch-published-plugin-assets \
            .github/plugin-acceptance.json "$RUNNER_TEMP/published-plugin-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/published-plugin-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Upload curl diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}-curl-diagnostics
          path: ${{ runner.temp }}/published-plugin-assets/*.curl.log
          if-no-files-found: ignore
          retention-days: 5
