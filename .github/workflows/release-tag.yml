name: Release tag

# The release pull request is prepared by `among-tools release-prepare` and
# merged by the owner (docs/releasing.md). Merging it puts a commit titled
# `chore(release): X.Y.Z` on main. This workflow recognises that commit, tags it
# `vX.Y.Z` and starts release-draft.yml on the tag, which builds the packages
# and fills a GitHub Release draft. Publishing the draft stays the owner's
# manual decision; nothing here creates or publishes a GitHub Release.
#
# A tag created with the repository token starts no push workflow, so the draft
# workflow is started with workflow_dispatch on the tag instead. It then runs
# with the tag as its ref and the tag's commit as its commit.
#
# The decision (is this a release commit, does it carry the version and the
# highlights, is the version above every stable tag, does the tag exist) is made
# by `among-tools release-tag` in a job that holds no write permission. The job
# that holds the write token checks out nothing and only carries the decision out.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: >-
          Release candidate number N (required for a manual run): tags the
          commit of the current stable release tag as v<version>-rc.N and starts
          its draft.
        required: false
        type: string

permissions: {}

# One group per commit and candidate: a single group would let GitHub drop a
# queued run when a newer one arrives, and a dropped run would leave a release
# commit untagged.
concurrency:
  group: release-tag-${{ github.sha }}-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      action: ${{ steps.decision.outputs.action }}
      tag: ${{ steps.decision.outputs.tag }}
      sha: ${{ steps.decision.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Decide whether and what to tag
        id: decision
        env:
          CARGO_HOME: ${{ runner.temp }}/release-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/among-tools/Cargo.toml --bin among-tools
          tool="$CARGO_TARGET_DIR/release/among-tools"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            "$tool" release-tag . push "$GITHUB_SHA" | tee "$RUNNER_TEMP/decision"
          else
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "run this workflow on main, not on $GITHUB_REF" >&2; exit 1; }
            "$tool" release-tag . candidate "$CANDIDATE" | tee "$RUNNER_TEMP/decision"
          fi
          cat "$RUNNER_TEMP/decision" >> "$GITHUB_OUTPUT"

  tag:
    needs: decide
    if: needs.decide.outputs.action == 'create' || needs.decide.outputs.action == 'exists'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ needs.decide.outputs.action }}
      TAG: ${{ needs.decide.outputs.tag }}
      SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - name: Create the tag and start its draft
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "unexpected tag '$TAG'" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit '$SHA'" >&2; exit 1; }
          if [ "$ACTION" = create ]; then
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null
            echo "Created $TAG at $SHA"
          fi
          # A re-run after a failed dispatch starts the draft; a re-run after a
          # started one does not start it twice.
          runs=$(gh run list --repo "$repo" --workflow release-draft.yml --branch "$TAG" \
            --json databaseId --jq length)
          if [ "$runs" = 0 ]; then
            gh workflow run release-draft.yml --repo "$repo" --ref "$TAG"
            echo "Started release-draft.yml on $TAG"
          else
            echo "release-draft.yml already ran on $TAG"
          fi
