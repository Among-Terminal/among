name: Release tag

# The release pull request is prepared by `among-tools release-prepare` and
# merged by the owner (docs/releasing.md). Merging it puts a commit titled
# `chore(release): X.Y.Z` on main. This workflow recognises that commit, tags it
# `vX.Y.Z` and starts release-draft.yml on the tag, which builds the packages
# and fills a GitHub Release draft. Publishing the draft stays the owner's
# manual decision; nothing here creates or publishes a GitHub Release.
#
# A tag created with the repository token starts no push workflow, so the draft
# workflow is started with workflow_dispatch on the tag instead. It then runs
# with the tag as its ref and the tag's commit as its commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: >-
          Release candidate number N. Tags the commit of the current stable
          release tag as v<version>-rc.N and starts its draft. Leave empty on
          any other run.
        required: true
        type: string

permissions: {}

# One group per commit: a single group would let GitHub drop a queued run when
# a newer one arrives, and a dropped run would leave a release commit untagged.
concurrency:
  group: release-tag-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tag a merged release commit and start its draft
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "release tag: $*" >&2; exit 1; }
          repo="$GITHUB_REPOSITORY"

          subject=$(gh api "repos/$repo/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          pattern='^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$'
          if [[ ! "$subject" =~ $pattern ]]; then
            echo "Not a release commit: $subject"
            exit 0
          fi
          version="${BASH_REMATCH[1]}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "version '$version' has a leading zero"

          # The title alone must not decide: the commit has to carry the version.
          cargo=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$repo/contents/Cargo.toml?ref=$GITHUB_SHA" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          [ "$cargo" = "$version" ] || fail "the title says $version but Cargo.toml says '$cargo'"

          tag="v$version"
          existing=$(gh api "repos/$repo/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
            echo "Created $tag at $GITHUB_SHA"
          else
            [ "$existing" = "$GITHUB_SHA" ] || fail "$tag already exists at $existing, not at $GITHUB_SHA"
            echo "$tag already exists at $GITHUB_SHA"
          fi

          # A re-run after a failed dispatch starts the draft; a re-run after
          # a started one does not start it twice.
          runs=$(gh run list --repo "$repo" --workflow release-draft.yml --branch "$tag" \
            --json databaseId --jq length)
          if [ "$runs" = 0 ]; then
            gh workflow run release-draft.yml --repo "$repo" --ref "$tag"
            echo "Started release-draft.yml on $tag"
          else
            echo "release-draft.yml already ran on $tag"
          fi

  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Tag the release commit as a release candidate and start its draft
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "release candidate: $*" >&2; exit 1; }
          repo="$GITHUB_REPOSITORY"
          [ "$GITHUB_REF" = refs/heads/main ] || fail "run this workflow on main, not on $GITHUB_REF"
          [[ "$CANDIDATE" =~ ^[1-9][0-9]*$ ]] || fail "candidate '$CANDIDATE' must be a positive integer without leading zeros"

          version=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$repo/contents/Cargo.toml?ref=main" \
            | grep -m1 '^version = ' | cut -d'"' -f2)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "Cargo.toml version '$version' is not MAJOR.MINOR.PATCH"

          # The candidate is the exact commit of the stable tag, which the tag
          # job put on the merge commit of the release pull request.
          sha=$(gh api "repos/$repo/commits/refs/tags/v$version" --jq .sha 2>/dev/null) \
            || fail "v$version does not exist; merge the release pull request first"
          relation=$(gh api "repos/$repo/compare/$sha...main" --jq .status)
          case "$relation" in
            ahead|identical) ;;
            *) fail "$sha is not contained in main ($relation)" ;;
          esac

          tag="v$version-rc.$CANDIDATE"
          existing=$(gh api "repos/$repo/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
            echo "Created $tag at $sha"
          else
            [ "$existing" = "$sha" ] || fail "$tag already exists at $existing, not at $sha"
          fi
          runs=$(gh run list --repo "$repo" --workflow release-draft.yml --branch "$tag" \
            --json databaseId --jq length)
          if [ "$runs" = 0 ]; then
            gh workflow run release-draft.yml --repo "$repo" --ref "$tag"
            echo "Started release-draft.yml on $tag"
          else
            echo "release-draft.yml already ran on $tag"
          fi
