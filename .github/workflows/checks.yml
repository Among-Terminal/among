name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-candidate:
    uses: ./.github/workflows/plugin-candidate.yml
    with:
      artifact: plugin-candidate-checks

  # Runs only by hand once the prerelease exists, and its failure fails nothing.
  # It becomes a required release-candidate condition after publication.
  published-prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Observe the published prerelease
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev pkg-config
          cargo +1.98.1 build --release --locked --manifest-path tools/among-tools/Cargo.toml
          tools/among-tools/target/release/among-tools prepare-official-plugin-inputs --prerelease "$RUNNER_TEMP/official-prerelease"

  native:
    needs: plugin-candidate
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-candidate-checks
          path: ${{ runner.temp }}/plugin-candidate
      - name: Native and isolated-display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev pkg-config \
            desktop-file-utils appstream librsvg2-common gsettings-desktop-schemas xvfb openbox dbus-x11 \
            xdotool x11-utils imagemagick squashfs-tools pulseaudio-utils
      - name: Check root on the runner's disk
        # Job-level env cannot read the runner context, so the root and the
        # Cargo home below it are exported for every later step from here.
        run: |
          echo "AMONG_CHECK_ROOT=$RUNNER_TEMP/among-checks" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/among-checks/ci-cargo" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/among-checks"
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
          dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - name: Three independent Cargo packages
        run: sh scripts/check-packages.sh
      - name: Notification accessibility consumers on owned displays
        run: |
          set -euo pipefail
          cargo build --locked --example notification-plugin
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/notification-a11y-tests.jsonl"
          app_test="$(jq -s -er '
            [.[] | select(.reason == "compiler-artifact" and .profile.test == true
              and .target.name == "among" and .target.kind == ["bin"] and .executable != null)]
            | if length == 1 then .[0].executable else error("expected one application test executable") end
          ' "$RUNNER_TEMP/notification-a11y-tests.jsonl")"
          case "$app_test" in "$PWD"/target/debug/deps/*) ;; *) exit 1 ;; esac
          test -f "$app_test" && test -x "$app_test" && test ! -L "$app_test"
          profile="$(dirname "$(dirname "$app_test")")"
          test -x "$profile/notification-command-fixture"
          test -x "$profile/examples/notification-plugin"
          "$app_test" --list --ignored > "$RUNNER_TEMP/notification-a11y-listing.txt"
          for case_name in \
            accessibility_checks_reject_missing_and_incorrect_properties \
            ordinary_app_provider_controls_and_declarative_actions_use_one_live_core \
            native_role_review_is_explicit_reachable_and_restored_without_starting_code \
            visual_attention_is_live_static_accessible_and_geometry_neutral; do
            name="app::notification_ui_tests::$case_name"
            test "$(grep -Fxc "$name: test" "$RUNNER_TEMP/notification-a11y-listing.txt")" -eq 1
            log="$AMONG_CHECK_ROOT/notification-a11y-$case_name.log"
            tools/among-tools/target/release/among-tools ci-x11 \
              "$app_test" "$name" --exact --ignored --test-threads=1 --nocapture --color=never 2>&1 | tee "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Prepare complete locked notice graphs
        # host builds do not acquire every target-specific source in the notice inventory.
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path examples/plugins/Cargo.toml
          cargo fetch --locked --manifest-path tools/among-tools/Cargo.toml
      - name: Verify locked offline Cargo notices
        id: notices
        env:
          AMONG_CHECK_ROOT: ${{ runner.temp }}/among-checks/notices
        run: tools/among-tools/target/release/among-tools third-party-notices . THIRD_PARTY check
      - name: Retain sanitized notice failure diagnostics
        if: ${{ failure() && steps.notices.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notice-diagnostics-${{ matrix.runner }}
          path: ${{ runner.temp }}/among-checks/notices/among-notices-*/metadata-failure.json
          if-no-files-found: error
          retention-days: 5
      - name: Native metadata and offline release policy
        run: |
          desktop-file-validate data/com.github.among-terminal.desktop
          appstreamcli validate --no-net --strict data/com.github.among-terminal.metainfo.xml
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test release_policy --test stable_build --test release_metadata --test promotion
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test stable_source
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test menu_geometry --test platform --test launch_identity --test snap_runtime --test snap_workflow
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test native_inventory
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test native_sources --test apt_provenance --test apt_collect --test native_notices --test native_unpack
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test source_delivery --test source_snapshot --test delivery_package --test notices
          # Promotion admission, the publication state machine (stable and nightly),
          # the GitHub/Store destination rules and both adapters driven against
          # stand-in gh, curl and snapcraft programs (adapter_processes).
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test promotion --test promotion_nightly --test promotion_destinations --test release_policy --test adapter_processes --test promotion_preflight
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test nightly
          tools/among-tools/target/release/among-tools check-release-metadata .
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test installation
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test deb
          tools/among-tools/target/release/among-tools check-deb-source-inputs .
          tools/among-tools/target/release/among-tools check-rpm-spec .
          cargo test --locked --manifest-path tools/among-tools/Cargo.toml --test deb_workflow --test rpm --test rpm_workflow --test publication_boundary
          tools/among-tools/target/release/among-tools check-deb-workflow .
      - name: Native source extraction and APT collection in disposable audit containers
        run: |
          docker build --file tools/among-tools/containers/Dockerfile.deb-selection --tag among-source-audit:ci .
          set -- $(find tools/among-tools/target/debug/deps -maxdepth 1 -type f -executable -name 'native_unpack-*')
          test "$#" -eq 1
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,mode=1777,size=128m \
            --mount "type=bind,source=$PWD,target=$PWD,readonly" \
            --workdir "$PWD" among-source-audit:ci \
            "$PWD/$1" --ignored --exact actual_dpkg_source_extraction_records_build_inputs_and_refuses_owner_output --nocapture
          # APT collection rewrites the container's APT configuration, so it
          # runs as the container's root, still offline and without capabilities.
          set -- $(find tools/among-tools/target/debug/deps -maxdepth 1 -type f -executable -name 'apt_collect-*')
          test "$#" -eq 1
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user 0:0 --tmpfs /tmp:rw,exec,mode=1777,size=128m \
            --mount "type=bind,source=$PWD,target=$PWD,readonly" \
            --workdir "$PWD" among-source-audit:ci \
            "$PWD/$1" --ignored --exact actual_collection_preserves_a_local_signed_repository_in_a_root_container --nocapture
      # A separate step, so these real-process checks run even when a later
      # step that needs published plugin inputs cannot.
      - name: Plugin development mode belongs to the primary instance
        run: |
          set -euo pipefail
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-plugin-development target/release/among
      - name: Isolated native X11 regressions
        run: |
          set -euo pipefail
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-live-focus target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-live-resize target/release/among
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/preferences-tests.jsonl"
          host_tests="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "among" and .target.kind == ["bin"] and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected one actual among test executable") end' "$RUNNER_TEMP/preferences-tests.jsonl")"
          tools/among-tools/target/release/among-tools prepare-candidate-plugin-inputs \
            "$RUNNER_TEMP/plugin-candidate" "$AMONG_CHECK_ROOT/official-plugin-inputs"
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-development-install "$host_tests" \
            "$AMONG_CHECK_ROOT/official-plugin-inputs" "$RUNNER_TEMP/plugin-candidate"
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-plugin-install "$host_tests" \
            "$AMONG_CHECK_ROOT/official-plugin-inputs" | tee "$AMONG_CHECK_ROOT/published-install.log"
          profile="$(awk '/^Published profile: / { count++; sub(/^Published profile: /, ""); path=$0 } END { if (count != 1) exit 1; print path }' "$AMONG_CHECK_ROOT/published-install.log")"
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-live-status . target/release/among "$profile"
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-preferences-from-cargo \
            "$RUNNER_TEMP/preferences-tests.jsonl" "$AMONG_CHECK_ROOT/official-plugin-inputs"
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-sessions target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-split-directory target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-scroll-calibration target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-sidebar-rename target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-workspace-reorder target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-pane-workspace-move target/release/among
          cargo build --release --locked --example check-drag-source
          cargo build --release --locked --manifest-path tools/among-tools/Cargo.toml --example summary-plugin
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-pane-drag-guards target/release/among target/release/examples/check-drag-source tools/among-tools/target/release/examples/summary-plugin
          cargo build --release --locked --manifest-path tools/among-tools/Cargo.toml --example notice-plugin
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-window-controls target/release/among tools/among-tools/target/release/examples/notice-plugin
          cargo build --release --locked --example check-clipboard
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-context-menu target/release/among target/release/examples/check-clipboard light
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-context-menu target/release/among target/release/examples/check-clipboard dark
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-context-menu-launch target/release/among
          tools/among-tools/target/release/among-tools ci-x11 \
            tools/among-tools/target/release/among-tools check-desktop . target/release/among
      - name: Independent Linux measurements
        run: tools/among-tools/target/release/among-tools check-resource-measurements examples/plugins/target/release/system-status
      - name: Original installer ENOSPC assertions on a dedicated bounded tmpfs
        run: |
          docker build --file tools/among-tools/containers/Dockerfile.display --tag among-installer-enospc:ci tools/among-tools/containers
          root="$AMONG_CHECK_ROOT/installer-enospc"
          mkdir -m 700 "$root" "$root/tmp" "$root/run" "$root/shm"
          cargo test --locked --no-run --message-format=json > "$root/cargo-tests.jsonl"
          docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /owned-full:rw,nosuid,nodev,noexec,mode=1777,size=128m \
            --mount "type=bind,source=$PWD,target=$PWD,readonly" \
            --mount "type=bind,source=$root,target=$root" \
            --mount "type=bind,source=$root/tmp,target=/tmp" \
            --mount "type=bind,source=$root/run,target=/run" \
            --mount "type=bind,source=$root/shm,target=/dev/shm" \
            --env "AMONG_CHECK_ROOT=$root" --env TMPDIR=/tmp --workdir "$PWD" \
            among-installer-enospc:ci \
            "$PWD/tools/among-tools/target/release/among-tools" check-installer-enospc-from-cargo "$root/cargo-tests.jsonl"
      - name: Ignored Rust graphical tests on individual owned displays
        run: |
          cargo build --locked --example fake-plugin
          cargo test --locked --no-run --manifest-path tools/among-tools/Cargo.toml --message-format=json > "$RUNNER_TEMP/tool-tests.jsonl"
          tools/among-tools/target/release/among-tools run-ignored-tests "$RUNNER_TEMP/tool-tests.jsonl"
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/test-executables.jsonl"
          tools/among-tools/target/release/among-tools run-ignored-tests "$RUNNER_TEMP/test-executables.jsonl"
      - name: Real audio through each distribution's declared packages
        run: |
          cargo build --locked --example audio-probe --bin among
          input="$RUNNER_TEMP/native-audio-input"
          mkdir "$input"
          cp target/debug/examples/audio-probe target/debug/among tools/among-tools/target/release/among-tools "$input/"
          status=0
          for image in \
            debian@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f \
            ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 \
            fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42; do
            name="${image%%@*}"
            output="$RUNNER_TEMP/native-audio-$name"
            mkdir -m 777 "$output"
            echo "::group::$name"
            docker run --rm \
              --mount "type=bind,source=$PWD/packaging/ci/native-audio,target=/ci,readonly" \
              --mount "type=bind,source=$input,target=/input,readonly" \
              --mount "type=bind,source=$output,target=/output" \
              "$image" sh /ci/check.sh || { echo "::error::$name system audio route failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
