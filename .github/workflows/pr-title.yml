name: PR title

# The squash-merge commit takes the pull request title, and the release tooling
# reads that commit to decide the next version, so the title must be a
# Conventional Commit. The job always runs (no path filters) so that it can be a
# required check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the title as a Conventional Commit
        env:
          # Passed through the environment, never interpolated into the script,
          # so a hostile title cannot inject shell code.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The title is never printed: the runner scans every output line for
          # workflow commands, so a title containing one could forge annotations.
          # Any non-empty scope without parentheses is accepted, like the release
          # tooling accepts it.
          pattern='^(feat|fix|docs|test|ci|build|perf|refactor|chore)(\([^()]+\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Title accepted."
          else
            {
              echo "::error title=Invalid pull request title::The title must look like 'type(scope): summary'."
              echo "Allowed types: feat, fix, docs, test, ci, build, perf, refactor, chore."
              echo "The scope is optional; '!' before the colon marks a breaking change."
              echo "The title itself is not echoed here; read it on the pull request page."
            } >&2
            exit 1
          fi
