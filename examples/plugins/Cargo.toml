[package]
name = "among-example-plugins"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustix = { version = "1", features = ["fs"] }

[[bin]]
name = "clock"
path = "src/bin/clock.rs"

[[bin]]
name = "system-status"
path = "src/bin/system-status.rs"

[[bin]]
name = "pane-pwd"
path = "src/bin/pane-pwd.rs"
